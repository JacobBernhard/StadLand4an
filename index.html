<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kartkollen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --paper:#F3F6F8; --card:#FFFFFF; --ink:#10263B; --muted:#56687A; --line:#D3DDE5;
  --sea:#CBE3F0; --edge:#FFFFFF; --blue:#005B99; --blue-soft:#DCEBF6; --yellow:#FECC02; --yellow-ink:#5A4500;
  --good:#1D8A55; --good-soft:#DDF3E7; --bad:#C23E36; --bad-soft:#FADFDC;
  --lb:79%; --sat:46%; --label:#10263B; --halo:rgba(255,255,255,.9);
  --shadow:0 1px 2px rgba(16,38,59,.06),0 8px 24px rgba(16,38,59,.07);
  --display:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0C1722; --card:#132331; --ink:#E6EEF5; --muted:#9CB0C2; --line:#284052;
    --sea:#0D2638; --edge:#0C1722; --blue:#5AA9E6; --blue-soft:#163449; --yellow:#FFD43B; --yellow-ink:#2B2100;
    --good:#43C987; --good-soft:#123527; --bad:#FF6F66; --bad-soft:#3A1D1D;
    --lb:31%; --sat:30%; --label:#F2F7FB; --halo:rgba(12,23,34,.9);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0C1722; --card:#132331; --ink:#E6EEF5; --muted:#9CB0C2; --line:#284052;
  --sea:#0D2638; --edge:#0C1722; --blue:#5AA9E6; --blue-soft:#163449; --yellow:#FFD43B; --yellow-ink:#2B2100;
  --good:#43C987; --good-soft:#123527; --bad:#FF6F66; --bad-soft:#3A1D1D;
  --lb:31%; --sat:30%; --label:#F2F7FB; --halo:rgba(12,23,34,.9);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:18px 48px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,.ls:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:44px;height:44px;flex:none}
.brand h1{font-size:2.1rem;font-weight:800;letter-spacing:-.01em}
.brand p{color:var(--muted);font-size:.95rem;line-height:1.3}
.tabs{display:flex;gap:6px;background:var(--card);padding:6px;border-radius:999px;box-shadow:var(--shadow);overflow-x:auto;max-width:100%}
.tab{border:0;background:transparent;padding:6px 16px;border-radius:999px;font-family:var(--display);font-weight:700;font-size:1.05rem;white-space:nowrap;color:var(--muted)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--blue);color:#fff}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.mapcard{position:relative;background:var(--sea);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);height:min(84vh,880px);min-height:420px}
#map{display:block;width:100%;height:100%}
.ls{fill:hsl(var(--h) var(--sat) calc(var(--lb) + var(--dl)));stroke:var(--edge);stroke-width:1.2;stroke-linejoin:round;transition:fill .25s}
.ls.target{fill:var(--yellow)}
.ls.reveal{stroke:var(--yellow);stroke-width:3}
.ls.dim{opacity:.45}
.explore .ls{cursor:pointer}
.explore .ls:hover{filter:brightness(1.06) saturate(1.2)}
.ls.picked{fill:var(--yellow)}
.city{cursor:default}
.explore .city{cursor:pointer}
.city .dot{fill:var(--card);stroke:var(--ink);stroke-width:2}
.city.ok .dot{fill:var(--good);stroke:var(--card)}
.city.no .dot{fill:var(--bad);stroke:var(--card)}
.city.cur .dot{fill:var(--yellow);stroke:var(--ink)}
.city .ring{fill:none;stroke:var(--yellow);stroke-width:3;opacity:0}
.city.cur .ring{opacity:1;animation:pulse 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.8);opacity:0}}
.city.hide{display:none}
.lbl{font-family:var(--display);font-weight:700;fill:var(--label);paint-order:stroke;stroke:var(--halo);stroke-linejoin:round;pointer-events:none}
.lbl.land{font-weight:600;fill:var(--muted);letter-spacing:.02em}
.regions{position:absolute;left:12px;top:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 24px)}
.reg{border:0;background:var(--card);border-radius:999px;padding:3px 12px;font-family:var(--display);font-weight:600;font-size:.92rem;color:var(--muted);box-shadow:var(--shadow)}
.reg[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.compass{position:absolute;right:14px;bottom:12px;font-family:var(--display);font-weight:700;color:var(--muted);font-size:.85rem;text-align:center;line-height:1}
.compass svg{width:26px;height:26px;display:block;margin:0 auto 2px}

.panel{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px}
.label{font-family:var(--display);font-weight:600;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.qhead{display:flex;align-items:center;gap:12px}
.progress{flex:1;height:10px;border-radius:5px;background:var(--paper);overflow:hidden}
.progress i{display:block;height:100%;background:var(--blue);transition:width .3s}
.score{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.panel h2{font-size:1.65rem}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-weight:700}
.field input{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;font-size:1.15rem;width:100%}
.field input:focus{border-color:var(--blue);outline:none}
.field input.ok{border-color:var(--good);background:var(--good-soft)}
.field input.no{border-color:var(--bad);background:var(--bad-soft)}
.field .hint{font-family:var(--display);font-weight:600;letter-spacing:.18em;color:var(--blue);min-height:1.2em}
.field .res{font-size:.95rem}
.res.ok{color:var(--good)} .res.no{color:var(--bad)}
.res b{color:var(--ink)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;font-family:var(--display);font-weight:700;font-size:1rem}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;flex:1 1 auto}
.btn.primary:hover{filter:brightness(1.08)}
.toggle{display:flex;align-items:center;gap:8px;font-size:.95rem;color:var(--muted)}
.toggle input{width:18px;height:18px;accent-color:var(--blue)}
.fact{background:var(--blue-soft);border-radius:14px;padding:10px 14px;font-size:.95rem}
.fact b{font-family:var(--display)}
.done{text-align:center;gap:10px}
.stars{font-size:2.6rem;letter-spacing:.1em;color:var(--line)}
.stars .on{color:var(--yellow)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:2px 10px;font-weight:700;font-size:.9rem}
.info h2{font-size:1.9rem}
.info .sub{color:var(--muted)}
.list{display:flex;flex-wrap:wrap;gap:6px}
.list button{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:2px 12px;font-weight:700}
.tip{color:var(--muted);font-size:.95rem}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.9rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px;background:var(--c)}

@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .mapcard{height:62vh;min-height:360px}
}
@media (max-width:480px){ .brand h1{font-size:1.7rem} .panel h2{font-size:1.4rem} }
@media (prefers-reduced-motion:reduce){ .city.cur .ring{animation:none;opacity:1} .progress i,.ls{transition:none} }
</style>

</head>

    gCity.append(cityEl[item.n].g);
    panel.innerHTML=head()+`
      <div><div class="label">Den gula pricken</div><h2>Vilken stad är det?</h2></div>
      <div class="field"><label for="in1">Stad</label><input id="in1" autocomplete="off" autocapitalize="words" spellcheck="false"><span class="hint" id="h1"></span></div>
      ${askLand?`<div class="field"><label for="in2">Landskap</label><input id="in2" autocomplete="off" autocapitalize="words" spellcheck="false"><span class="hint" id="h2"></span></div>`:''}
      <div class="btns"><button class="btn primary" id="go">Kolla svaret</button><button class="btn" id="hint">Ledtråd</button><button class="btn" id="skip">Hoppa över</button></div>
      <label class="toggle"><input type="checkbox" id="askland" ${askLand?'checked':''}> Fråga även vilket landskap staden ligger i</label>`;
    $('#askland').addEventListener('change',e=>{ askLand=e.target.checked; store.set('kartkollen-askland',askLand); renderQ(); });
  } else {
    MAP.land.forEach(l=>landEl[l.n].classList.toggle('target',l===item));
    panel.innerHTML=head()+`
      <div><div class="label">Det gula området</div><h2>Vilket landskap är det?</h2></div>
      <div class="field"><label for="in1">Landskap</label><input id="in1" autocomplete="off" autocapitalize="words" spellcheck="false"><span class="hint" id="h1"></span></div>
      <div class="btns"><button class="btn primary" id="go">Kolla svaret</button><button class="btn" id="hint">Ledtråd</button><button class="btn" id="skip">Hoppa över</button></div>
      <p class="tip">Sverige har 25 landskap. Götaland är grönt, Svealand gult och Norrland lila på kartan.</p>`;
  }
  $('#go').addEventListener('click',check);
  $('#hint').addEventListener('click',hint);
  $('#skip').addEventListener('click',()=>check(true));
  panel.querySelectorAll('input:not([type=checkbox])').forEach((inp,i,all)=>inp.addEventListener('keydown',e=>{
    if(e.key!=='Enter') return; e.preventDefault();
    if(answered) return next();
    if(i<all.length-1 && !all[i+1].value) all[i+1].focus(); else check();
  }));
  setTimeout(()=>{ const f=$('#in1'); if(f && window.matchMedia('(hover:hover)').matches) f.focus(); },30);
}
function hint(){
  if(answered) return;
  hintLv=Math.min(2,hintLv+1); const item=queue[qi];
  $('#h1').textContent=hintFor(item.n,hintLv);
  if(mode==='city'&&askLand) $('#h2').textContent=hintFor(item.l[0],hintLv);
}
function check(skip){
  if(answered) return; answered=true;
  const item=queue[qi]; let got=0, total=0, html='';
  const i1=$('#in1'), r1=judge(skip===true?'':i1.value,[item.n]);
  total++; if(r1.ok) got++;
  i1.classList.add(r1.ok?'ok':'no'); i1.readOnly=true; $('#h1').innerHTML=resText(r1,[item.n]);
  if(mode==='city'){
    const e=cityEl[item.n]; e.g.classList.remove('cur'); e.t.style.display='';
    if(askLand){
      const i2=$('#in2'), r2=judge(skip===true?'':i2.value,item.l); total++; if(r2.ok) got++;
      i2.classList.add(r2.ok?'ok':'no'); i2.readOnly=true; $('#h2').innerHTML=resText(r2,item.l);
    }
    e.g.classList.add(got===total?'ok':'no');
    item.l.forEach(n=>{ landEl[n].classList.add('reveal'); landLbl[n].style.display=''; });
    html=`<div class="fact"><b>${item.n}</b> ligger i ${item.l.join(' och ')}, ${regionOf[item.l[0]]}. ${NOTES[item.n]?NOTES[item.n]+' ':''}${FACTS[item.n]||''}</div>`;
  } else {
    landEl[item.n].classList.remove('target'); landEl[item.n].classList.add('reveal'); landLbl[item.n].style.display='';
    const cs=MAP.cities.filter(c=>c.l.includes(item.n)).map(c=>c.n);
    html=`<div class="fact"><b>${item.n}</b> ligger i ${item.r}.${cs.length?' Städer härifrån i övningen: '+cs.join(', ')+'.':''}</div>`;
  }
  pts+=got; max+=total; if(got<total) missed.push(item);
  applyScale();
  const btns=panel.querySelector('.btns');
  btns.insertAdjacentHTML('beforebegin',html);
  btns.innerHTML=`<button class="btn primary" id="next">${qi+1<queue.length?'Nästa':'Se resultatet'}</button>`;
  $('#next').addEventListener('click',next);
  panel.querySelector('.score').textContent=`${qi+1} av ${queue.length} · ${pts} poäng`;
  $('#next').focus();
}
function next(){
  if(mode==='city'){ const it=queue[qi]; it.l.forEach(n=>landEl[n].classList.remove('reveal')); }
  else { const it=queue[qi]; landEl[it.n].classList.remove('reveal'); }
  qi++; renderQ(); applyScale();
}
function renderDone(){
  Object.values(cityEl).forEach(e=>e.g.classList.remove('cur'));
  const share=max?pts/max:0, stars=share>=.9?3:share>=.65?2:share>=.35?1:0;
  const msg=['Bra kämpat! Öva lite till så går det bättre nästa gång.','Bra jobbat! Du kan redan många.','Jättebra! Du kan nästan alla.','Fantastiskt! Du kan Sverigekartan!'][stars];
  panel.innerHTML=`<div class="done panel" style="box-shadow:none;padding:0">
    <div class="label">Klart!</div><h2>${pts} av ${max} poäng</h2>
    <div class="stars">${[0,1,2].map(i=>`<span class="${i<stars?'on':''}">★</span>`).join('')}</div>
    <p>${msg}</p>
    ${missed.length?`<p class="tip">Att öva mer på:</p><div class="chips">${missed.map(m=>`<span class="chip">${m.n}</span>`).join('')}</div>`:''}
    <div class="btns" style="justify-content:center">${missed.length?'<button class="btn primary" id="again-missed">Öva på de missade</button>':''}<button class="btn" id="again">Börja om</button></div>
  </div>`;
  const m=missed.slice();
  if(missed.length) $('#again-missed').addEventListener('click',()=>startMode(mode,shuffle(m)));
  $('#again').addEventListener('click',()=>startMode(mode));
}

/* ---------- explore ---------- */
let showNames=true;
function renderExplore(sel){
  Object.values(cityEl).forEach(e=>{ e.g.classList.toggle('hide',!inRegion(e.c.r)); e.t.style.display=showNames&&inRegion(e.c.r)?'':'none'; });
  MAP.land.forEach(l=>{ landLbl[l.n].style.display=showNames&&inRegion(l.r)?'':'none'; landEl[l.n].classList.toggle('picked',!!sel&&sel.type==='land'&&sel.n===l.n); });
  Object.values(cityEl).forEach(e=>e.g.classList.toggle('cur',!!sel&&sel.type==='city'&&sel.n===e.c.n));
  let body;
  if(!sel){
    body=`<div><div class="label">Utforska</div><h2>Tryck på kartan</h2></div>
      <p>Tryck på ett landskap eller en stad för att se vad det heter. Välj Götaland, Svealand eller Norrland uppe på kartan för att zooma in.</p>
      <div class="legend"><span style="--c:hsl(120 46% 70%)">Götaland</span><span style="--c:hsl(44 60% 70%)">Svealand</span><span style="--c:hsl(300 40% 76%)">Norrland</span></div>`;
  } else if(sel.type==='land'){
    const l=MAP.land.find(x=>x.n===sel.n), cs=MAP.cities.filter(c=>c.l.includes(l.n));
    body=`<div class="info"><div class="label">Landskap</div><h2>${l.n}</h2><p class="sub">Ligger i ${l.r}</p></div>
      ${cs.length?`<p>Städer i övningen:</p><div class="list">${cs.map(c=>`<button data-city="${c.n}">${c.n}</button>`).join('')}</div>`:'<p class="tip">Ingen av städerna i övningen ligger här.</p>'}`;
  } else {
    const c=MAP.cities.find(x=>x.n===sel.n);
    body=`<div class="info"><div class="label">Stad</div><h2>${c.n}</h2><p class="sub">${c.l.join(' och ')}, ${regionOf[c.l[0]]}</p></div>
      <div class="fact">${NOTES[c.n]?NOTES[c.n]+' ':''}${FACTS[c.n]}</div>
      <div class="list">${c.l.map(n=>`<button data-land="${n}">Visa ${n}</button>`).join('')}</div>`;
  }
  panel.innerHTML=body+`<label class="toggle"><input type="checkbox" id="names" ${showNames?'checked':''}> Visa namnen på kartan</label>
    <div class="btns"><button class="btn primary" id="tocity">Testa städerna</button><button class="btn" id="toland">Testa landskapen</button></div>`;
  $('#names').addEventListener('change',e=>{showNames=e.target.checked;renderExplore(sel);});
  $('#tocity').addEventListener('click',()=>startMode('city'));
  $('#toland').addEventListener('click',()=>startMode('land'));
  panel.querySelectorAll('[data-city]').forEach(b=>b.addEventListener('click',()=>renderExplore({type:'city',n:b.dataset.city})));
  panel.querySelectorAll('[data-land]').forEach(b=>b.addEventListener('click',()=>renderExplore({type:'land',n:b.dataset.land})));
  applyScale();
}
gLand.addEventListener('click',e=>{ if(mode!=='explore') return; const p=e.target.closest('.ls'); if(p) renderExplore({type:'land',n:p.dataset.n}); });
gCity.addEventListener('click',e=>{ if(mode!=='explore') return; const g=e.target.closest('.city'); if(g) renderExplore({type:'city',n:g.dataset.n}); });

/* ---------- boot ---------- */
computeBoxes(); applyScale(); startMode('city');
})();
</script>

</body>
</html>
